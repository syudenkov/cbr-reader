plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.cbrviewer'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // SQLite
    implementation 'org.xerial:sqlite-jdbc:3.44.1.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects'

    // Archive handling
    implementation 'com.github.junrar:junrar:7.5.5'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Frontend build configuration
def frontendDir = file("${project.rootDir}/../frontend")
def frontendBuildDir = file("${frontendDir}/dist")
def staticDir = file("${project.projectDir}/src/main/resources/static")

task npmInstall(type: Exec) {
    description = 'Install frontend dependencies'
    workingDir frontendDir
    commandLine 'npm', 'install'
    inputs.file("${frontendDir}/package.json")
    inputs.file("${frontendDir}/package-lock.json")
    outputs.dir("${frontendDir}/node_modules")
}

task buildFrontend(type: Exec, dependsOn: npmInstall) {
    description = 'Build frontend for production'
    workingDir frontendDir
    commandLine 'npm', 'run', 'build'
    inputs.dir("${frontendDir}/src")
    inputs.file("${frontendDir}/package.json")
    inputs.file("${frontendDir}/vite.config.ts")
    inputs.file("${frontendDir}/tsconfig.json")
    outputs.dir(frontendBuildDir)
}

task copyFrontend(type: Copy, dependsOn: buildFrontend) {
    description = 'Copy frontend build to Spring Boot static resources'
    from frontendBuildDir
    into staticDir
}

task cleanFrontend(type: Delete) {
    description = 'Clean frontend build artifacts from static directory'
    delete staticDir
}

// Make processResources depend on copyFrontend so frontend is built before jar
processResources.dependsOn copyFrontend

// Clean frontend when running clean task
clean.dependsOn cleanFrontend

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
}
