spring:
  application:
    name: cbr-viewer
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:./data/cbr_viewer.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 4433

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  storage:
    comics-path: ${COMICS_PATH:/home/stress/projects/cbr_viewer/backend/storage/comics}
    audio-path: ${AUDIO_PATH:/home/stress/projects/cbr_viewer/backend/storage/audio}
    cache-path: ${CACHE_PATH:/home/stress/projects/cbr_viewer/backend/storage/cache}
  cache:
    max-size-mb: 100
    ttl-days: 20
    cleanup-cron: "0 0 2 * * *"
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3344}
  security:
    # AES-256 encryption master key (64 hex characters = 32 bytes)
    # Generate with: openssl rand -hex 32
    # For production, set via environment variable: ENCRYPTION_MASTER_KEY
    encryption-key: ${ENCRYPTION_MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
